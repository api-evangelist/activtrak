          default: 150
      responses:
        '200':
          description: A response with the Report for Computers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        date:
                          type: string
