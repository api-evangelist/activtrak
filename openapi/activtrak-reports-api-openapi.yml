    get:
      operationId: getWorkingHoursForUsers
      summary: This API call returns a list of Working Hour Activity objects along with a total (used for pagination). This data is fro
      tags:
      - Reports
      description: This API call returns a list of Working Hour Activity objects along with a total (used for pagination). This data is from the user's perspective.
      parameters:
      - name: from
        in: query
        required: true
        description: 'The starting date. Format: YYYY-MM-DD.'
        schema:
