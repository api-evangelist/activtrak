      - name: to
        in: query
        required: true
        description: 'The end date (inclusive). Format: YYYY-MM-DD.'
        schema:
          type: string
          format: date-time
      - name: deviceId
        in: query
        required: false
        description: The specific device id to fetch data. Only one of the fields (clientId, groupId, deviceId) can be sent per request.
        schema:
          type: string
      - name: groupId
        in: query
        required: false
        description: The specific group Id to fetch data. Only one of the fields (clientId, groupId, deviceId) can be sent per request.
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: The page number used in pagination.
        schema:
          type: integer
