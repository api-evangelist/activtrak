                          nullable: true
                        activeTime:
                          type: object
                          properties:
                            productive:
                              type: integer
                              format: int64
                            unproductive:
                              type: integer
                              format: int64
                            undefined:
                              type: integer
                              format: int64
                            total:
                              type: integer
                              format: int64
                        passiveTime:
                          type: object
                          properties:
                            productive:
                              type: integer
                              format: int64
                            unproductive:
                              type: integer
                              format: int64
                            undefined:
                              type: integer
                              format: int64
                            total:
                              type: integer
                              format: int64
                        totalTime:
                          type: integer
                          format: int64
                  total:
                    type: integer
                    format: int64
        '400':
          description: Bad request. Failed StatusResponse with an error message indicating the reason of the failure.
        '500':
          description: Internal Server Error.
      security:
      - ApiKeyAuth: []
