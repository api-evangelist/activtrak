                              type: string
                              nullable: true
                            members:
                              type: array
                              nullable: true
                              items:
                                type: object
                                properties:
                                  '0':
                                    type: object
                                    properties:
                                      value:
                                        type: string
                                        nullable: true
                                      display:
                                        type: string
                                        nullable: true
                                      $ref:
                                        type: string
                                        nullable: true
                                      type:
                                        type: string
                                        nullable: true
                            meta:
                              type: object
                              properties:
                                resourceType:
                                  type: string
                                created:
                                  type: string
                                lastModified:
                                  type: string
                                location:
                                  type: string
                                version:
                                  type: string
                            urn:ietf:params:scim:schemas:extension:activtrak:2.0:Group:
                              type: object
                              properties:
                                sourceType:
                                  type: number
                                instanceId:
                                  type: string
        '400':
