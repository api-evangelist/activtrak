name: ActivTrak
description: >-
  ActivTrak is a workforce analytics and productivity-monitoring SaaS platform.
  Its Public APIs (v2) expose REST endpoints across three surfaces: the Live
  Data / Reports API (Working Hours and Activity Log), account administration
  (Clients, Consumers, and full SCIM 2.0 user and group management), and a Bulk
  Import HR Data Connector for CSV-driven user provisioning. Authentication is
  via an API key sent in the x-api-key header (a Bearer form is also accepted on
  some endpoints). Regional hosts are available for the United States, European
  Union, United Kingdom, Canada, and Australia. ActivTrak is backed by Sapphire
  Ventures and is profiled in the API Evangelist network.
